<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- JARVIS's app icon (design B, "on black"): his design A visor on a rounded black tile, like
       the notch he lives in. Source for `npx tauri icon`, which makes every size in ../ from it. -->
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f7f9"/>
      <stop offset="0.7" stop-color="#eceef1"/>
      <stop offset="1" stop-color="#dcdfe4"/>
    </linearGradient>
    <linearGradient id="slot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0f17"/>
      <stop offset="1" stop-color="#1b2433"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="#000"/>
  <!-- The visor: 140 × 98 in the spec, here × 5.03, centred. -->
  <rect x="160" y="265.6" width="704" height="492.8" rx="171" fill="url(#shell)"/>
  <rect x="290.7" y="461.7" width="442.5" height="100.6" rx="50.3" fill="url(#slot)" stroke="#c9cdd4" stroke-width="5"/>
  <rect x="351.1" y="486.9" width="321.8" height="50.3" rx="25.1" fill="#0a84ff"/>
</svg>
